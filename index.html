<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QN TEMPO 0.1.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appHeader">
  <h1 id="appLogo"><span id="appLogoQN">QN</span>TEMPO <span id="appVersion">v0.1.1</span></h1>
  <button id="soundToggleBtn" title="音色を切り替え">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    <span id="soundToggleLabel">クリック</span>
  </button>
</div>

<div class="stage-wrap">
  <div class="stage">
    <div class="stage-meta">
      <span class="stage-meta-label">Beat</span>
      <span class="stage-meta-value" id="beatCounter">1 / 4</span>
    </div>
    <div class="beats" id="beatsRow"></div>
    <div class="stage-hint">拍を長押しでアクセント編集</div>
  </div>
</div>

<div class="time-controls-row" style="margin-top:18px;">
  <div id="bpmDisplay">
    <span class="bpm-val" id="bpmVal">120</span>
    <span class="bpm-unit">BPM</span>
  </div>
</div>
<div class="tempo-name-row">
  <span id="tempoName">Moderato</span>
</div>

<div class="bpm-panel-box">
  <div class="bpm-stepper-row">
    <button class="step-btn" id="bpmMinus" title="BPMを下げる">−</button>
    <div class="bpm-slider-wrap">
      <input type="range" id="bpmSlider" min="30" max="260" value="120">
      <div class="bpm-marks"><span>30</span><span>90</span><span>150</span><span>210</span><span>260</span></div>
    </div>
    <button class="step-btn" id="bpmPlus" title="BPMを上げる">＋</button>
  </div>
  <div class="tap-readout-row">
    <span class="tap-readout">TAPで測定：<b id="tapReadout">—</b></span>
  </div>
</div>

<div class="basic-panel-box">
  <div class="adjust-controls-row">
    <div class="time-controls-buttons">
      <div class="header-btn-wrapper">
        <button id="sigToggleBtn" class="av-toggle-btn" title="拍子">
          <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 8h18v2H3v-2zm0 8h18v2H3v-2z"/></svg>
          <span class="av-toggle-btn-text">
            <span class="av-toggle-btn-value" id="sigToggleValue">4/4</span>
            <span class="av-toggle-btn-label">拍子</span>
          </span>
        </button>
      </div>

      <div class="header-btn-wrapper">
        <button id="subdivToggleBtn" class="av-toggle-btn" title="分割">
          <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4V4zm6 4h4v12h-4V8zm6-6h4v18h-4V2z"/></svg>
          <span class="av-toggle-btn-text">
            <span class="av-toggle-btn-value" id="subdivToggleValue">4分</span>
            <span class="av-toggle-btn-label">分割</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 拍子ピッカー -->
<div class="av-popup-backdrop" id="sigBackdrop"></div>
<div class="av-popup" id="sigPopup">
  <p class="popup-title">拍子を選択</p>
  <div class="choice-grid" id="sigGrid"></div>
  <button class="popup-close-btn" id="sigCloseBtn">決定</button>
</div>

<!-- 分割ピッカー -->
<div class="av-popup-backdrop" id="subdivBackdrop"></div>
<div class="av-popup" id="subdivPopup">
  <p class="popup-title">拍の分割（全拍に適用）</p>
  <div class="subdiv-choice-row" id="subdivChoiceRow">
    <div class="subdiv-choice selected" data-subdiv="quarter">
      <span class="sd-label">4分</span>
      <span class="sd-dots"><i></i></span>
    </div>
    <div class="subdiv-choice" data-subdiv="eighth">
      <span class="sd-label">8分</span>
      <span class="sd-dots"><i></i><i></i></span>
    </div>
    <div class="subdiv-choice" data-subdiv="sixteenth">
      <span class="sd-label">16分</span>
      <span class="sd-dots"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="subdiv-choice" data-subdiv="eighth-triplet">
      <span class="sd-label">8分3連</span>
      <span class="sd-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="subdiv-choice" data-subdiv="eighth-triplet-hollow">
      <span class="sd-label">8分3連中抜き</span>
      <span class="sd-dots"><i></i><i class="ghost"></i><i></i></span>
    </div>
  </div>
  <button class="popup-close-btn" id="subdivCloseBtn">決定</button>
</div>

<!-- 下部固定トランスポート（QNAUDIOのtop-controlsに準拠） -->
<div class="top-controls" id="topControls">
  <div class="top-controls-row">
    <div class="tripleNavBtn" title="BPM操作 / 再生">
      <button id="bpmMinus2" class="tripleNavBtn-third tripleNavBtn-left" title="BPM -1">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        <span class="top-controls-btn-label">BPM</span>
      </button>
      <span class="tripleNavBtn-divider"></span>
      <button id="playToggle" class="tripleNavBtn-third tripleNavBtn-center" title="再生 / 停止">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span class="top-controls-btn-label">Play</span>
      </button>
      <span class="tripleNavBtn-divider"></span>
      <button id="bpmPlus2" class="tripleNavBtn-third tripleNavBtn-right" title="BPM +1">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span class="top-controls-btn-label">BPM</span>
      </button>
    </div>
    <button id="tapBtn" class="loopbtn" title="TAPテンポ">
      <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
      <span class="top-controls-btn-label">Tap</span>
    </button>
  </div>
</div>
<div class="top-controls-spacer" id="topControlsSpacer"></div>

<script src="app.js"></script>
</body>
</html>
